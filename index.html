<html lang="tr">
<head>
<meta charset="UTF-8">

<meta property="og:url" content="https://pinarozdemir.github.io/pinar-ozdemir/">

<meta property="og:description" content="Akademiye benimle katıl; 1:1 WhatsApp mentörlüğü ve özel topluluk ek ücret olmadan yanında.">
<meta property="og:image" content="https://pinarozdemir.github.io/pinar-ozdemir/og.jpg">

<meta property="og:locale:alternate" content="en_GB">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F3EFE6; --cream-2:#EAE4D6;
  --sage:#9FB092; --sage-light:#DCE3D3; --sage-deep:#6F846A;
  --terra:#BF6A4B; --terra-deep:#9E5238; --terra-soft:#EBD3C7;
  --forest:#233B2F; --forest-2:#2C4A3B;
  --ink:#2A2A26; --ink-soft:#5C5D54;
  --bg:var(--cream); --fg:var(--ink); --surface:#FBF9F4; --line:rgba(42,42,38,.14);
  --maxw:1120px; --pad:clamp(20px,5vw,64px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E2621; --fg:#EDE8DC; --surface:#26312B; --line:rgba(237,232,220,.16);
    --ink:#EDE8DC; --ink-soft:#B9B5A8; --cream-2:#2C3730; --sage-light:#33453A; --terra-soft:#4A3229;
  }
}
:root[data-theme="dark"]{
  --bg:#1E2621; --fg:#EDE8DC; --surface:#26312B; --line:rgba(237,232,220,.16);
  --ink:#EDE8DC; --ink-soft:#B9B5A8; --cream-2:#2C3730; --sage-light:#33453A; --terra-soft:#4A3229;
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto} *{transition:none!important;animation:none!important}}
body{background:var(--bg);color:var(--fg);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
h1,h2,h3{font-family:"Fraunces","Iowan Old Style",Georgia,serif;font-weight:400;line-height:1.1;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.6rem);font-variation-settings:"opsz" 144}
h2{font-size:clamp(1.9rem,3.6vw,2.9rem);font-variation-settings:"opsz" 96;margin-bottom:.6em}
h3{font-size:1.35rem;font-variation-settings:"opsz" 48}
p{max-width:62ch}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
section{padding:clamp(56px,9vw,120px) 0}
.lead{font-size:1.15rem;color:var(--ink-soft)}
:focus-visible{outline:3px solid var(--terra);outline-offset:3px;border-radius:4px}

/* notice bar */
.notice{background:var(--forest);color:#F3EFE6;font-size:.86rem;text-align:center;padding:9px var(--pad);line-height:1.4}
.notice a{color:inherit;text-underline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{font-family:"Fraunces",Georgia,serif;font-size:1.25rem;text-decoration:none;font-variation-settings:"opsz" 30}
.nav ul{display:flex;gap:26px;list-style:none;padding:0;flex-wrap:nowrap}
.nav ul a{text-decoration:none;font-size:.95rem;color:var(--ink-soft);white-space:nowrap}
.nav ul a:hover{color:var(--fg)}
.nav-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.nav .btn{white-space:nowrap}
.ig{display:inline-flex;color:var(--ink-soft);padding:6px}
.ig:hover{color:var(--terra)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:transparent;font:inherit;font-size:.82rem;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--forest);color:#F3EFE6}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--terra);color:#fff;text-decoration:none;font-weight:500;padding:14px 24px;border-radius:999px;border:0;font:inherit;font-size:1rem;cursor:pointer;transition:background .18s ease}
.btn:hover{background:var(--terra-deep)}
.btn.small{padding:10px 18px;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface)}
@media (max-width:1060px){.nav .btn{display:none} .nav ul{gap:18px} .nav ul a{font-size:.9rem}}
@media (max-width:720px){.nav ul{display:none}}

/* hero */
.hero{padding:0;background:var(--sage-light);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,72px);align-items:end;min-height:min(86vh,760px)}
.hero-copy{padding:clamp(48px,8vw,110px) 0 clamp(40px,6vw,80px)}
.hero-copy h1{margin:18px 0 22px}
.hero-copy h1 em{font-style:italic;font-weight:300}
.hero-copy .lead{margin-bottom:34px;font-size:1.2rem}
.kicker{font-size:1rem;color:var(--sage-deep)}
.hero-media{position:relative;align-self:stretch}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:220px 220px 0 0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.who{margin-top:26px;font-size:.95rem;color:var(--ink-soft)}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;min-height:0}
  .hero-copy{padding-top:44px;padding-bottom:12px}
  .hero-media{margin:0 calc(-1*var(--pad)) 0;max-height:62vh}
  .hero-media img{border-radius:0;aspect-ratio:4/5;height:auto}
}

/* about */
.about .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(28px,6vw,80px);align-items:center}
.about img{border-radius:12px 12px 120px 12px;aspect-ratio:3/4;object-fit:cover;object-position:50% 15%}
.about p+p{margin-top:1em}
.badge{display:inline-flex;align-items:center;gap:10px;margin-top:28px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.badge i{width:10px;height:10px;border-radius:50%;background:var(--sage-deep);display:inline-block}
@media (max-width:820px){.about .wrap{grid-template-columns:1fr} .about img{max-width:420px}}

/* offer */
.offer{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.offer-head{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:end;margin-bottom:clamp(32px,5vw,56px)}
.offer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.offer-item{padding:28px 28px 30px;background:var(--bg);border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.offer-item .mark{width:44px;height:44px;border-radius:12px;background:var(--terra-soft);display:grid;place-items:center;color:var(--terra-deep)}
.offer-item p{color:var(--ink-soft);font-size:1rem}
.offer-photo{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:stretch}
.offer-photo img{border-radius:18px;height:100%;object-fit:cover;object-position:50% 30%;min-height:260px}
.quote{padding:28px 30px;border-radius:18px;background:var(--forest);color:#F3EFE6;display:flex;flex-direction:column;justify-content:center;font-family:"Fraunces",Georgia,serif;font-size:clamp(1.3rem,2vw,1.7rem);line-height:1.35;font-variation-settings:"opsz" 60}
.quote small{display:block;margin-top:18px;font-family:"DM Sans",sans-serif;font-size:.92rem;opacity:.75}
.note{font-size:.92rem;color:var(--ink-soft);margin-top:22px;max-width:70ch}
@media (max-width:820px){.offer-head,.offer-grid,.offer-photo{grid-template-columns:1fr}}

/* compare */
.compare table{width:100%;border-collapse:collapse;font-size:1rem}
.compare th,.compare td{padding:18px 16px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.compare th{font-family:"Fraunces",Georgia,serif;font-weight:400;font-size:1.25rem;padding-top:0}
.compare td:first-child{color:var(--ink-soft);width:24%}
.compare th:nth-child(3),.compare td:nth-child(3){background:var(--sage-light);}
.compare th:nth-child(3){border-radius:14px 14px 0 0}
.compare tr:last-child td:nth-child(3){border-radius:0 0 14px 14px;border-bottom:0}
.compare tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;border-radius:14px}
@media (max-width:640px){.compare table{font-size:.9rem} .compare th,.compare td{padding:12px 10px}}

/* academy */
.academy{background:var(--forest);color:#F3EFE6}
.academy h2{color:#F3EFE6}
.academy .lead{color:rgba(243,239,230,.78)}
.academy-top{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,72px);align-items:center;margin-bottom:clamp(40px,6vw,72px)}
.academy-top img{border-radius:18px}
.curr{display:grid;gap:clamp(40px,6vw,72px)}
.curr-block{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,4vw,56px);align-items:center}
.curr-block:nth-child(even){grid-template-columns:1.2fr .8fr}
.curr-block:nth-child(even)>div{order:2}
.curr h3{color:#F3EFE6;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid rgba(243,239,230,.2)}
.curr ul{list-style:none;padding:0;display:grid;gap:9px}
.curr li{display:flex;gap:12px;align-items:flex-start;color:rgba(243,239,230,.9)}
.curr li::before{content:"";flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--sage);margin-top:.55em}
.curr img{border-radius:14px}
.program{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,3vw,32px);margin-top:clamp(48px,7vw,88px)}
.program-main{background:var(--forest-2);border-radius:20px;padding:clamp(26px,4vw,44px)}
.program-main h3,.program-side h3{color:#F3EFE6}
.price{display:flex;align-items:baseline;gap:14px;margin:14px 0 18px}
.price span{font-family:"Fraunces",Georgia,serif;font-size:clamp(2.6rem,5vw,4rem);line-height:1;color:#F3EFE6}
.price small{color:rgba(243,239,230,.7);font-size:.95rem}
.program-main>p{color:rgba(243,239,230,.85);margin-bottom:18px}
.program-main ul{list-style:none;padding:0;display:grid;gap:10px}
.program-main li{display:flex;gap:12px;color:rgba(243,239,230,.92)}
.program-main li::before{content:"✓";color:var(--sage);flex:0 0 auto}
.fine{margin-top:20px;font-size:.88rem;color:rgba(243,239,230,.6)}
.program-side{display:grid;align-content:start}
.withme{background:var(--sage-light);color:var(--ink);border-radius:20px;padding:clamp(24px,3.5vw,36px)}
.withme h3{color:#233B2F}
.withme p{color:#3F4A40;margin:10px 0 22px}
.withme .btn{background:var(--terra);color:#fff}
.withme .btn:hover{background:var(--terra-deep)}
.matchai{border:1px solid rgba(243,239,230,.2);border-radius:20px;padding:clamp(22px,3vw,30px)}
.matchai img{border-radius:12px;margin-bottom:16px}
.matchai p{color:rgba(243,239,230,.8);font-size:.98rem;margin-top:8px}
@media (max-width:820px){.program{grid-template-columns:1fr}}
.academy .btn{background:var(--sage);color:var(--forest)}
.academy .btn:hover{background:#B4C4A8}
@media (max-width:820px){.academy-top,.curr-block,.curr-block:nth-child(even){grid-template-columns:1fr} .curr-block:nth-child(even)>div{order:0}}

/* steps */
.steps ol{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:22px;counter-reset:s}
.steps li{counter-increment:s;padding:26px 26px 28px;border-radius:18px;background:var(--sage-light);position:relative}
.steps li::before{content:counter(s);font-family:"Fraunces",Georgia,serif;font-size:2.4rem;color:var(--sage-deep);display:block;line-height:1;margin-bottom:14px}
.steps h3{margin-bottom:8px}
.steps p{color:var(--ink-soft);font-size:1rem}
@media (max-width:820px){.steps ol{grid-template-columns:1fr}}

/* faq */
.faq .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,5vw,72px)}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;list-style:none;padding:20px 40px 20px 0;font-family:"Fraunces",Georgia,serif;font-size:1.2rem;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:50%;transform:translateY(-50%);font-family:"DM Sans",sans-serif;font-size:1.5rem;color:var(--terra)}
details[open] summary::after{content:"–"}
details p{padding:0 0 20px;color:var(--ink-soft)}
@media (max-width:820px){.faq .wrap{grid-template-columns:1fr}}

/* matchai */
.match .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,6vw,80px);align-items:center}
.match-media img{border-radius:18px}
.match-media p{font-size:.88rem;color:var(--ink-soft);margin-top:10px}
@media (max-width:820px){.match .wrap{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--sage-light)}
.contact-card{background:var(--surface);border-radius:28px;padding:clamp(28px,5vw,64px);border:1px solid var(--line)}
.contact-head{max-width:60ch;margin-bottom:clamp(28px,4vw,48px)}
.contact-card h2{margin-bottom:12px}
.contact-card p{color:var(--ink-soft)}
.handles{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,56px)}
.handle-block{border-top:1px solid var(--line);padding-top:24px}
.handle-role{font-size:.9rem;color:var(--sage-deep);margin-bottom:8px}
.handle{display:block;font-family:"Fraunces",Georgia,serif;font-size:clamp(1.7rem,3.2vw,2.6rem);line-height:1.1;text-decoration:none;color:var(--fg);margin-bottom:12px;font-variation-settings:"opsz" 96;word-break:break-all}
.handle:hover{color:var(--terra-deep)}
.handle-desc{margin-bottom:20px}
.contact-actions{display:flex;gap:12px;flex-wrap:wrap}
.alt{margin-top:32px;font-size:.9rem}
.alt a{color:var(--terra-deep);text-underline-offset:3px}
@media (max-width:820px){.handles{grid-template-columns:1fr}}

/* footer */
footer{padding:44px 0 calc(44px + 64px);font-size:.9rem;color:var(--ink-soft);border-top:1px solid var(--line)}
footer .wrap{display:grid;grid-template-columns:1fr 1fr;gap:24px}
footer p+p{margin-top:8px}
footer a{color:inherit}
@media (max-width:820px){footer .wrap{grid-template-columns:1fr}}
@media (min-width:821px){footer{padding-bottom:44px}}

/* mobile sticky cta */
.mcta{position:fixed;left:0;right:0;bottom:0;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:none;z-index:50}
.mcta .btn{width:100%;justify-content:center}
@media (max-width:820px){.mcta{display:block}}
</style>
</head>
<body>

<div class="notice"><span data-i18n="notice.text"></span> <a href="#academy" data-i18n="notice.link"></a></div>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top">Pınar Özdemir</a>
    <nav aria-label="Site">
      <ul>
        <li><a href="#about" data-i18n="nav.about"></a></li>
        <li><a href="#offer" data-i18n="nav.offer"></a></li>
        <li><a href="#academy" data-i18n="nav.academy"></a></li>
        <li><a href="#matchai">matchAI</a></li>
        <li><a href="#faq" data-i18n="nav.faq"></a></li>
      </ul>
    </nav>
    <div class="nav-right">
      <a class="ig" href="https://www.instagram.com/pinarinlondon.co/" target="_blank" rel="noopener" aria-label="Instagram @pinarinlondon.co"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg></a>
      <div class="lang" role="group" aria-label="Dil / Language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="btn small" href="https://ig.me/m/pinarinlondon.co" target="_blank" rel="noopener" data-i18n="cta.start"></a>
    </div>
  </div>
</header>

<main id="top">

<section class="hero" aria-labelledby="hero-h">
  <div class="wrap">
    <div class="hero-copy">
      <p class="kicker" data-i18n="hero.kicker"></p>
      <h1 id="hero-h" data-i18n-html="hero.title"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="hero-actions">
        <a class="btn" href="https://ig.me/m/pinarinlondon.co" target="_blank" rel="noopener" data-i18n="cta.start"></a>
        <a class="btn ghost" href="#offer" data-i18n="cta.what"></a>
      </div>
      <p class="who" data-i18n="hero.who"></p>

function setLang(l){
  const d=I18N[l]||I18N.tr;
  document.documentElement.lang=l;
  document.title=d["meta.title"];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n; if(d[k]!=null) el.textContent=d[k];});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const k=el.dataset.i18nHtml; if(d[k]!=null) el.innerHTML=d[k];});
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===l)));
  try{localStorage.setItem('pinar-lang',l);}catch(e){}
  if(location.hash==='#en'||location.hash==='#tr'){history.replaceState(null,'','#'+l);}
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
let initial='tr';
try{
  if(location.hash==='#en') initial='en';
  else{ const s=localStorage.getItem('pinar-lang'); if(s) initial=s; else if(!/^tr/i.test(navigator.language||'')) initial='en'; }
}catch(e){}
setLang(initial);
document.getElementById('year').textContent=new Date().getFullYear();
